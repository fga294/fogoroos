<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fogoroos - Botafogo Australian Supporters</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="bg-gradient-to-br from-gray-900 to-black text-white min-h-screen">
  <nav class="bg-black/50 backdrop-blur-md p-6 fixed w-full top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-orange-500 to-red-600 bg-clip-text text-transparent">Fogoroos</h1>
      <ul class="flex space-x-6">
        <li><a href="admin.html" class="hover:text-orange-400 transition">Dashboard</a></li>
        <li><a href="players.html" class="hover:text-orange-400 transition">Players</a></li>
        <li><a href="matches.html" class="hover:text-orange-400 transition">Matches</a></li>
      </ul>
    </div>
  </nav>
  <main class="pt-24 pb-12 max-w-6xl mx-auto px-6">
    <div class="text-center mb-20">
      <h2 class="text-6xl font-black mb-6 bg-gradient-to-r from-orange-500 via-red-600 to-yellow-500 bg-clip-text text-transparent">Fogoroos</h2>
      <p class="text-xl text-gray-300 mb-12">Australian Supporters of Botafogo Futebol e Regatas</p>
      <a href="admin.html" class="bg-gradient-to-r from-orange-500 to-red-600 px-12 py-4 rounded-full text-xl font-bold hover:from-orange-400 hover:to-red-500 transition-all shadow-2xl">Enter U-14 Stats Dashboard</a>
    </div>
    <div class="grid md:grid-cols-3 gap-8">
      <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl border border-white/20">
        <h3 class="text-2xl font-bold mb-4">U-14 Team Stats</h3>
        <p class="text-gray-300">Track players, matches, fitness & more.</p>
      </div>
      <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl border border-white/20">
        <h3 class="text-2xl font-bold mb-4">Botafogo Pride</h3>
        <p class="text-gray-300">Glorioso down under!</p>
      </div>
      <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl border border-white/20">
        <h3 class="text-2xl font-bold mb-4">Join Us</h3>
        <p class="text-gray-300">Aussie Fogos unite!</p>
      </div>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
